services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: taxi-postgres
    restart: always
    environment:
      POSTGRES_USER: taxi_user
      POSTGRES_PASSWORD: taxi_password_2026
      POSTGRES_DB: taxi_logistics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - taxi_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxi_user -d taxi_logistics"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: taxi-redis
    restart: always
    ports:
      - "6389:6379"
    volumes:
      - redis_data:/data
    networks:
      - taxi_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taxi-backend-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgres://taxi_user:taxi_password_2026@postgres:5432/taxi_logistics
      REDIS_URL: redis://redis:6379/0
      PORT: 8000
      BINHANH_CUSTOMER_CODE: ${BINHANH_CUSTOMER_CODE:-}
      BINHANH_KEY: ${BINHANH_KEY:-}
      QUANLYXE_API_KEY: ${QUANLYXE_API_KEY:-}
    ports:
      - "1133:8000"
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    networks:
      - taxi_net

volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  taxi_net:
    driver: bridge
