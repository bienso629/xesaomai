name: Build Windows EXE & Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Desktop (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: ./app_tai_xe
        run: flutter pub get

      - name: Patch Windows CMake plugins (fix JNI & CppWinRT on MSVC v145)
        working-directory: ./app_tai_xe
        shell: pwsh
        run: |
          if (!(Test-Path "windows")) {
            flutter create --platforms=windows .
          }

          # 1. Patch jni CMakeLists in pub-cache to not build on Windows desktop
          Get-ChildItem -Path "$env:LOCALAPPDATA\Pub\Cache\hosted\pub.dev" -Filter "CMakeLists.txt" -Recurse | Where-Object { $_.FullName -like "*jni*src*CMakeLists.txt" } | ForEach-Object {
            Write-Host "Patching JNI CMakeLists: $($_.FullName)"
            Set-Content -Path $_.FullName -Value "cmake_minimum_required(VERSION 3.10)`nproject(jni_library VERSION 0.0.1 LANGUAGES C)`n"
          }

          # 2. Patch permission_handler_windows in pub-cache (fix /await -> /await:strict & upgrade CppWinRT for MSVC v145 / VS 18)
          Get-ChildItem -Path "$env:LOCALAPPDATA\Pub\Cache\hosted\pub.dev" -Filter "CMakeLists.txt" -Recurse | Where-Object { $_.FullName -like "*permission_handler_windows*windows*CMakeLists.txt" } | ForEach-Object {
            Write-Host "Patching permission_handler_windows CMakeLists: $($_.FullName)"
            $content = Get-Content -Path $_.FullName -Raw
            $content = $content -replace 'set\(CPPWINRT_VERSION "[^"]+"\)', 'set(CPPWINRT_VERSION "2.0.220418.1")'
            $content = $content -replace 'target_compile_options\(\$\{PLUGIN_NAME\} PRIVATE /await\)', 'target_compile_options(${PLUGIN_NAME} PRIVATE /await:strict)'
            Set-Content -Path $_.FullName -Value $content
          }

          # 3. Disable /WX (warnings as errors) in windows/CMakeLists.txt so new MSVC v145 warnings don't break the build
          if (Test-Path "windows/CMakeLists.txt") {
            Write-Host "Disabling /WX in windows/CMakeLists.txt"
            $winCmake = Get-Content -Path "windows/CMakeLists.txt" -Raw
            $winCmake = $winCmake -replace '/WX', ''
            Set-Content -Path "windows/CMakeLists.txt" -Value $winCmake
          }

      - name: Build Windows Release (.exe)
        working-directory: ./app_tai_xe
        shell: pwsh
        run: |
          flutter build windows --release -v *> build_windows.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== BUILD FAILED! ERRORS IN LOG ==="
            Select-String -Path build_windows.log -Pattern "error C|error LNK|FATAL_ERROR|CMake Error|Error:" -Context 2,3 | ForEach-Object { $_.ToString() }
            Write-Host "=== LAST 120 LINES OF LOG ==="
            Get-Content build_windows.log -Tail 120
            exit $LASTEXITCODE
          }
          Get-Content build_windows.log -Tail 30

      - name: Upload Build Log ( Always )
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-windows-log
          path: app_tai_xe/build_windows.log
          retention-days: 7

      - name: Package Windows Release (Portable ZIP & Setup Installer EXE)
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "app_tai_xe\build\windows\x64\runner\Release"
          $oldExe = Join-Path $releaseDir "app_tai_xe.exe"
          $newExe = Join-Path $releaseDir "SaoMai_TaiXe.exe"
          if ((Test-Path $oldExe) -and !(Test-Path $newExe)) {
            Rename-Item -Path $oldExe -NewName "SaoMai_TaiXe.exe" -Force
          }

          $hasCert = ![string]::IsNullOrWhiteSpace($env:WINDOWS_PFX_BASE64) -and ![string]::IsNullOrWhiteSpace($env:WINDOWS_PFX_PASSWORD)
          $pfxPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          $signtool = $null

          if ($hasCert) {
            Write-Host "Found WINDOWS_PFX_BASE64 secret. Signing Release EXE and DLL files with Authenticode SHA-256..."
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
            $signtool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter "signtool.exe" -Recurse |
              Where-Object { $_.FullName -match "x64\\signtool\.exe$" } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if ($null -eq $signtool) {
              throw "signtool.exe not found in Windows SDK"
            }
            $targets = Get-ChildItem -Path $releaseDir -Include "*.exe","*.dll" -File
            foreach ($file in $targets) {
              & $signtool.FullName sign /fd SHA256 /td SHA256 /tr "http://timestamp.digicert.com" /f $pfxPath /p $env:WINDOWS_PFX_PASSWORD $file.FullName
              if ($LASTEXITCODE -ne 0) { throw "Failed to sign $($file.Name)" }
            }
          } else {
            Write-Host "No WINDOWS_PFX_BASE64 secret configured; skipping Authenticode signing."
          }

          # 1. Tao goi Portable ZIP
          Compress-Archive -Path "$releaseDir\*" -DestinationPath "$env:GITHUB_WORKSPACE\SaoMai_TaiXe_Windows_x64.zip" -Force

          # 2. Bien dich bo cai dat Windows Setup (.exe) bang Inno Setup
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            Write-Host "Installing Inno Setup via Chocolatey..."
            choco install innosetup -y --no-progress
          }
          & $iscc "/O$env:GITHUB_WORKSPACE" "$env:GITHUB_WORKSPACE\app_tai_xe\windows\installer.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed to compile SaoMai_TaiXe_Setup_x64.exe"
          }

          # Ky so luon file bo cai dat SaoMai_TaiXe_Setup_x64.exe neu co PFX
          $setupExe = Join-Path $env:GITHUB_WORKSPACE "SaoMai_TaiXe_Setup_x64.exe"
          if ($hasCert -and (Test-Path $setupExe)) {
            & $signtool.FullName sign /fd SHA256 /td SHA256 /tr "http://timestamp.digicert.com" /f $pfxPath /p $env:WINDOWS_PFX_PASSWORD $setupExe
            if ($LASTEXITCODE -ne 0) { throw "Failed to sign SaoMai_TaiXe_Setup_x64.exe" }
          }
          if (Test-Path $pfxPath) {
            Remove-Item -Path $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Upload Windows EXE & Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SaoMai_TaiXe_Windows_x64
          path: |
            SaoMai_TaiXe_Setup_x64.exe
            SaoMai_TaiXe_Windows_x64.zip
          retention-days: 30

      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-latest
          name: "Bản cài đặt Sao Mai Vintrans (Windows .exe)"
          body: |
            Bản phát hành tự động cho Windows 64-bit:
            - **Cách 1 (Khuyên dùng - Bộ cài đặt tự động)**: Tải file `SaoMai_TaiXe_Setup_x64.exe` về máy và chạy để tự động cài đặt ứng dụng kèm biểu tượng ngoài màn hình Desktop.
            - **Cách 2 (Bản giải nén chạy liền)**: Tải file `SaoMai_TaiXe_Windows_x64.zip` về máy -> nhấp chuột phải chọn **Properties** -> tích **Unblock** (nếu có) -> giải nén toàn bộ thư mục và mở `SaoMai_TaiXe.exe` (giữ nguyên các file `.dll` và thư mục `data` đi kèm).
            - **Lưu ý trên Windows 11**: Nếu máy bật **Smart App Control** chặn ứng dụng nội bộ chưa có chứng thư số CA thương mại, mở **Windows Security -> App & browser control -> Smart App Control settings** chuyển sang **Off** theo hướng dẫn quản trị nội bộ.
          files: |
            SaoMai_TaiXe_Setup_x64.exe
            SaoMai_TaiXe_Windows_x64.zip
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
