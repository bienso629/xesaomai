name: Build iOS & macOS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS (.ipa, ký và đẩy TestFlight nếu có Secrets)
    runs-on: macos-latest
    env:
      HAS_SIGNING: ${{ secrets.IOS_DIST_CERT_P12_BASE64 != '' && secrets.IOS_PROVISION_PROFILE_BASE64 != '' && (vars.APPLE_TEAM_ID != '' || secrets.APPLE_TEAM_ID != '') }}
      HAS_ASC_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY != '' }}
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Chan doan secrets con thieu
        env:
          HAS_P12: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          HAS_PROFILE: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          HAS_TEAM_VAR: ${{ vars.APPLE_TEAM_ID }}
          HAS_TEAM_SECRET: ${{ secrets.APPLE_TEAM_ID }}
          HAS_P8: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          HAS_ISSUER: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          HAS_KEYID: ${{ secrets.APPSTORE_API_KEY_ID }}
        run: |
          echo "=== CHAN DOAN SECRETS ==="
          [ -n "$HAS_P12" ]      && echo "OK: IOS_DIST_CERT_P12_BASE64 co"     || echo "THIEU: IOS_DIST_CERT_P12_BASE64"
          [ -n "$HAS_PROFILE" ]  && echo "OK: IOS_PROVISION_PROFILE_BASE64 co" || echo "THIEU: IOS_PROVISION_PROFILE_BASE64"
          [ -n "$HAS_TEAM_VAR" ] && echo "OK: APPLE_TEAM_ID (Variables) co"    || echo "THIEU: APPLE_TEAM_ID o Variables"
          [ -n "$HAS_TEAM_SECRET" ] && echo "OK: APPLE_TEAM_ID (Secrets) co"   || echo "THIEU: APPLE_TEAM_ID o Secrets"
          [ -n "$HAS_P8" ]       && echo "OK: APPSTORE_API_PRIVATE_KEY co"     || OK=1
          [ -n "$HAS_ISSUER" ]   && echo "OK: APPSTORE_API_ISSUER_ID co"       || OK=1
          [ -n "$HAS_KEYID" ]    && echo "OK: APPSTORE_API_KEY_ID co"          || OK=1
          echo "=== KET QUA: kiem tra tab Actions de xem dong THIEU ==="

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: ./app_tai_xe
        run: flutter pub get

      # ---------- Không có Secrets: giữ cách build cũ (chưa ký) ----------
      - name: Build iOS Release (no codesign)
        if: env.HAS_SIGNING != 'true'
        working-directory: ./app_tai_xe
        run: |
          echo "::warning::Chưa đủ Secrets ký iOS, đang build bản chưa ký."
          flutter build ios --release --no-codesign --build-number=$BUILD_NUMBER

      - name: Package unsigned IPA
        if: env.HAS_SIGNING != 'true'
        working-directory: ./app_tai_xe/build/ios/iphoneos
        run: |
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qry "$GITHUB_WORKSPACE/SaoMai_TaiXe_iOS_unsigned.ipa" Payload

      # ---------- Có Secrets: ký bản App Store ----------
      - name: Cài chứng chỉ và provisioning profile
        if: env.HAS_SIGNING == 'true'
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          security cms -D -i "$RUNNER_TEMP/app.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/app.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Bật ký thủ công cho target Runner (chỉ trên máy build)
        if: env.HAS_SIGNING == 'true'
        working-directory: ./app_tai_xe/ios
        env:
          TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
        run: |
          # Chèn cấu hình ký vào 3 cấu hình của target app (dòng có bundle ID đúng của app, không đụng RunnerTests).
          perl -0pi -e 's/(\n(\t+)PRODUCT_BUNDLE_IDENTIFIER = com\.taxilogistics\.driver\.saomai;)/\n$2CODE_SIGN_STYLE = Manual;\n$2DEVELOPMENT_TEAM = $ENV{TEAM_ID};\n$2CODE_SIGN_IDENTITY = "Apple Distribution";\n$2"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution";\n$2PROVISIONING_PROFILE_SPECIFIER = "$ENV{PROFILE_NAME}";$1/g' Runner.xcodeproj/project.pbxproj
          grep -c "PROVISIONING_PROFILE_SPECIFIER" Runner.xcodeproj/project.pbxproj

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.taxilogistics.driver.saomai</key><string>$PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST

      - name: Build IPA đã ký
        if: env.HAS_SIGNING == 'true'
        working-directory: ./app_tai_xe
        run: |
          flutter build ipa --release --build-number=$BUILD_NUMBER \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"
          cp build/ios/ipa/*.ipa "$GITHUB_WORKSPACE/SaoMai_TaiXe_iOS.ipa"

      - name: Đẩy lên TestFlight
        if: env.HAS_SIGNING == 'true' && env.HAS_ASC_KEY == 'true'
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: SaoMai_TaiXe_iOS.ipa
          issuer-id: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Dọn keychain
        if: always() && env.HAS_SIGNING == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          rm -f "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/app.mobileprovision" "$HOME/.appstoreconnect/private_keys/"*.p8

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SaoMai_TaiXe_iOS
          path: SaoMai_TaiXe_iOS*.ipa
          retention-days: 30

  build-macos:
    name: Build macOS (.app + .pkg, ký và đẩy App Store nếu có Secrets)
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      HAS_MAC_SIGNING: ${{ secrets.IOS_DIST_CERT_P12_BASE64 != '' && secrets.MAC_PROVISION_PROFILE_BASE64 != '' && (vars.APPLE_TEAM_ID != '' || secrets.APPLE_TEAM_ID != '') }}
      HAS_ASC_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY != '' }}
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Chan doan secrets con thieu
        env:
          HAS_P12: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          HAS_MAC_INSTALLER: ${{ secrets.MAC_INSTALLER_P12_BASE64 }}
          HAS_MAC_PROFILE: ${{ secrets.MAC_PROVISION_PROFILE_BASE64 }}
          HAS_TEAM_VAR: ${{ vars.APPLE_TEAM_ID }}
          HAS_TEAM_SECRET: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "=== CHAN DOAN SECRETS MACOS ==="
          [ -n "$HAS_P12" ]           && echo "OK: IOS_DIST_CERT_P12_BASE64 co"     || echo "THIEU: IOS_DIST_CERT_P12_BASE64"
          [ -n "$HAS_MAC_INSTALLER" ] && echo "OK: MAC_INSTALLER_P12_BASE64 co"     || echo "THIEU: MAC_INSTALLER_P12_BASE64"
          [ -n "$HAS_MAC_PROFILE" ]   && echo "OK: MAC_PROVISION_PROFILE_BASE64 co" || echo "THIEU: MAC_PROVISION_PROFILE_BASE64"
          [ -n "$HAS_TEAM_VAR" ]      && echo "OK: APPLE_TEAM_ID (Variables) co"    || echo "THIEU: APPLE_TEAM_ID o Variables"
          [ -n "$HAS_TEAM_SECRET" ]   && echo "OK: APPLE_TEAM_ID (Secrets) co"      || echo "THIEU: APPLE_TEAM_ID o Secrets"
          echo "=== KET QUA: kiem tra tab Actions de xem dong THIEU ==="

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: ./app_tai_xe
        run: flutter pub get

      # ---------- Không đủ Secrets macOS: giữ cách build cũ (ZIP chưa ký) ----------
      - name: Build macOS Release (no codesign)
        if: env.HAS_MAC_SIGNING != 'true'
        working-directory: ./app_tai_xe
        run: |
          echo "::warning::Chưa đủ Secrets ký macOS App Store, đang build bản ZIP chưa ký."
          flutter build macos --release --build-number=$BUILD_NUMBER

      - name: Package macOS app into ZIP
        if: env.HAS_MAC_SIGNING != 'true'
        working-directory: ./app_tai_xe/build/macos/Build/Products/Release
        run: ditto -c -k --sequesterRsrc --keepParent app_tai_xe.app "$GITHUB_WORKSPACE/SaoMai_TaiXe_macOS.zip"

      # ---------- Có đủ Secrets: build bản App Store (PKG đã ký) ----------
      - name: Cài chứng chỉ và provisioning profile macOS
        if: env.HAS_MAC_SIGNING == 'true'
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          INSTALLER_P12_BASE64: ${{ secrets.MAC_INSTALLER_P12_BASE64 }}
          INSTALLER_P12_PASSWORD: ${{ secrets.MAC_INSTALLER_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.MAC_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build-macos.keychain-db"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          if [ -n "$INSTALLER_P12_BASE64" ]; then echo "$INSTALLER_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/installer.p12"; fi
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/mac.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          if [ -f "$RUNNER_TEMP/installer.p12" ]; then security import "$RUNNER_TEMP/installer.p12" -P "$INSTALLER_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"; fi
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          security cms -D -i "$RUNNER_TEMP/mac.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          cp "$RUNNER_TEMP/mac.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          cp "$RUNNER_TEMP/mac.mobileprovision" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$UUID.mobileprovision"
          echo "MAC_PROFILE_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Bật ký thủ công cho target Runner macOS
        if: env.HAS_MAC_SIGNING == 'true'
        working-directory: ./app_tai_xe/macos
        env:
          TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
          ASC_KEY_P8: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
        run: |
          perl -0pi -e 's/(\n(\t+)CODE_SIGN_ENTITLEMENTS = Runner\/(Release|DebugProfile)\.entitlements;)/\n$2CODE_SIGN_STYLE = Manual;\n$2DEVELOPMENT_TEAM = $ENV{TEAM_ID};\n$2CODE_SIGN_IDENTITY = "Apple Distribution";\n$2PROVISIONING_PROFILE_SPECIFIER = "$ENV{MAC_PROFILE_NAME}";$1/g' Runner.xcodeproj/project.pbxproj
          grep -c "PROVISIONING_PROFILE_SPECIFIER" Runner.xcodeproj/project.pbxproj

          cat > "$RUNNER_TEMP/ExportOptions-macOS.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>installerSigningCertificate</key><string>3rd Party Mac Installer Application</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.taxilogistics.driver.saomai</key><string>$MAC_PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST

          # Dat API key vao vi tri chuan de xcodebuild -allowProvisioningUpdates tu ky Installer
          mkdir -p "$HOME/private_keys"
          printf '%s' "$ASC_KEY_P8" > "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Build macOS App (bản dùng trực tiếp)
        if: env.HAS_MAC_SIGNING == 'true'
        working-directory: ./app_tai_xe
        run: |
          flutter build macos --release --build-number=$BUILD_NUMBER
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/app_tai_xe.app "$GITHUB_WORKSPACE/SaoMai_TaiXe_macOS.zip"

      - name: Archive và xuất PKG App Store
        if: env.HAS_MAC_SIGNING == 'true'
        working-directory: ./app_tai_xe
        run: |
          xcodebuild -workspace macos/Runner.xcworkspace -scheme Runner -configuration Release -destination "generic/platform=macOS" -archivePath build/macos/app.xcarchive archive -allowProvisioningUpdates
          xcodebuild -exportArchive -archivePath build/macos/app.xcarchive -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-macOS.plist" -exportPath build/macos/export -allowProvisioningUpdates
          cp build/macos/export/*.pkg "$GITHUB_WORKSPACE/SaoMai_TaiXe_macOS.pkg"

      - name: Cài đặt Fastlane
        if: env.HAS_MAC_SIGNING == 'true' && env.HAS_ASC_KEY == 'true'
        run: |
          sudo gem install fastlane --no-document || gem install fastlane --no-document

      - name: Đẩy PKG lên App Store Connect (fastlane)
        if: env.HAS_MAC_SIGNING == 'true' && env.HAS_ASC_KEY == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          # Ghi file API key JSON ra file that (dung ~ = /Users/runner)
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/api_key.json"
          ruby -e "require 'json'; puts JSON.generate({issuer_id: ENV['ASC_ISSUER_ID'], key_id: ENV['ASC_KEY_ID'], key: ENV['ASC_KEY_CONTENT'], in_house: false})" > "$KEY_PATH"
          echo "API key JSON: $(wc -c < "$KEY_PATH") bytes"
          # deliver ho tro upload pkg macOS; neu loi thi thu pilot
          fastlane run deliver pkg:"SaoMai_TaiXe_macOS.pkg" api_key_path:"$KEY_PATH" skip_screenshots:true skip_metadata:true force:true             || fastlane run pilot upload pkg:"SaoMai_TaiXe_macOS.pkg" api_key_path:"$KEY_PATH"             || echo "CANH_BAO: upload that bai - kiem tra log" 

      - name: Dọn keychain
        if: always() && env.HAS_MAC_SIGNING == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/build-macos.keychain-db" || true
          rm -f "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/installer.p12" "$RUNNER_TEMP/mac.mobileprovision" "$HOME/.appstoreconnect/private_keys/"*.p8

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SaoMai_TaiXe_macOS
          path: |
            SaoMai_TaiXe_macOS.zip
            SaoMai_TaiXe_macOS.pkg
          if-no-files-found: error
          retention-days: 30

  release:
    name: Đính kèm bản iOS & macOS vào GitHub Release
    needs: [ build-ios, build-macos ]
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-latest
          files: |
            dist/SaoMai_TaiXe_iOS_unsigned.ipa
            dist/SaoMai_TaiXe_iOS.ipa
            dist/SaoMai_TaiXe_macOS.zip
            dist/SaoMai_TaiXe_macOS.pkg
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
